name: Build Lit Chain Android APK (GitHub)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash
        working-directory: mobile

    env:
      CI: "1"
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: auth.litchain.org
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: random-reads-10add
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: random-reads-10add.firebasestorage.app
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "424669347546"
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.4"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Verify required Firebase variables
        run: |
          if [ -z "$EXPO_PUBLIC_FIREBASE_API_KEY" ]; then
            echo "::error::Missing GitHub secret EXPO_PUBLIC_FIREBASE_API_KEY"
            exit 1
          fi

          if [ -z "$EXPO_PUBLIC_FIREBASE_APP_ID" ]; then
            echo "::error::Missing GitHub secret EXPO_PUBLIC_FIREBASE_APP_ID"
            exit 1
          fi

      - name: Generate native Android project
        run: |
          npx expo prebuild \
            --platform android \
            --clean

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build standalone release APK
        working-directory: mobile/android
        run: |
          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Find APK
        id: apk
        run: |
          APK_PATH="$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::No release APK was produced."
            find android/app/build/outputs -maxdepth 5 -type f || true
            exit 1
          fi

          cp "$APK_PATH" LitChain-latest.apk
          echo "path=mobile/LitChain-latest.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LitChain-Android-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
