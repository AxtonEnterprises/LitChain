name: Build Lit Chain Android APK (GitHub + EAS)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash
        working-directory: mobile

    env:
      CI: "1"
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: auth.litchain.org
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: random-reads-10add
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: random-reads-10add.firebasestorage.app
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "424669347546"
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.4"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/15.0/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/14.0/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/13.0/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/11.0/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify required build variables
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing GitHub secret EXPO_TOKEN"
            exit 1
          fi

          if [ -z "$EXPO_PUBLIC_FIREBASE_API_KEY" ]; then
            echo "::error::Missing GitHub secret EXPO_PUBLIC_FIREBASE_API_KEY"
            exit 1
          fi

          if [ -z "$EXPO_PUBLIC_FIREBASE_APP_ID" ]; then
            echo "::error::Missing GitHub secret EXPO_PUBLIC_FIREBASE_APP_ID"
            exit 1
          fi

      - name: Install JavaScript dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Verify production Android identity
        run: |
          node <<'NODE'
          const fs = require("fs");
          const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
          const pkg = config?.expo?.android?.package;
          const googleServicesFile = config?.expo?.android?.googleServicesFile;

          if (pkg !== "org.theliteraturefoundation.litchain") {
            console.error(`Unexpected Android package: ${pkg}`);
            process.exit(1);
          }

          if (googleServicesFile !== "./google-services.json") {
            console.error(`Unexpected googleServicesFile: ${googleServicesFile}`);
            process.exit(1);
          }

          console.log("Android package: " + pkg);
          console.log("Firebase config: " + googleServicesFile);
          NODE

      - name: Build signed preview APK with EAS
        run: |
          rm -f LitChain-Preview-latest.apk
          npx eas-cli@latest build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output ./LitChain-Preview-latest.apk

      - name: Verify APK
        run: |
          if [ ! -f LitChain-Preview-latest.apk ]; then
            echo "::error::No APK was produced."
            exit 1
          fi

          ls -lh LitChain-Preview-latest.apk

      - name: Upload Lit Chain preview APK
        uses: actions/upload-artifact@v4
        with:
          name: LitChain-Android-Preview-APK
          path: mobile/LitChain-Preview-latest.apk
          if-no-files-found: error
          retention-days: 14
